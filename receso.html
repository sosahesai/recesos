<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel de Control Remoto · Recesos</title>
  <style>
    :root{--bg:#0b1120;--panel:#111827;--card:#1e293b;--card-expired:#7f1d1d;--accent:#38bdf8;--accent-dim:rgba(56,189,248,.15);--green:#22c55e;--green-dim:rgba(34,197,94,.18);--red:#ef4444;--red-dim:rgba(239,68,68,.2);--yellow:#eab308;--text:#f1f5f9;--muted:#94a3b8;--border:#334155;--radius:14px}
    *{box-sizing:border-box;margin:0;padding:0}
    body{font-family:'Segoe UI',system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;display:flex;flex-direction:column}
    .topbar{background:var(--panel);border-bottom:1px solid var(--border);padding:12px 20px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:100}
    .brand{display:flex;align-items:center;gap:12px}
    .brand-icon{width:40px;height:40px;background:var(--accent-dim);border-radius:10px;display:grid;place-items:center;font-size:1.3rem}
    .brand h1{font-size:1.15rem;font-weight:700}
    .brand span{display:block;font-size:.75rem;color:var(--muted)}
    .top-actions{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
    .global-time{display:flex;align-items:center;gap:6px;background:rgba(15,23,42,.6);border:1px solid var(--border);border-radius:10px;padding:6px 10px;font-size:.9rem}
    .global-time input{width:48px;background:transparent;border:none;color:var(--text);font-size:1rem;font-weight:700;text-align:center;outline:none}
    .global-time label{color:var(--muted);font-size:.8rem}
    button{font-family:inherit;font-weight:600;border:none;border-radius:10px;cursor:pointer;transition:.15s;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
    button:active{transform:scale(.96)}
    .btn{padding:10px 16px;font-size:.9rem}
    .btn-primary{background:var(--accent);color:#0f172a}
    .btn-primary:hover{background:#0ea5e9}
    .btn-success{background:var(--green);color:#052e16}
    .btn-success:hover{background:#16a34a}
    .btn-warning{background:var(--yellow);color:#422006}
    .btn-warning:hover{background:#ca8a04}
    .btn-danger{background:var(--red);color:#fff}
    .btn-danger:hover{background:#dc2626}
    .btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
    .btn-ghost:hover{background:rgba(148,163,184,.1);color:var(--text)}
    .btn-icon{width:36px;height:36px;padding:0;border-radius:8px;background:transparent;color:var(--muted);font-size:1rem}
    .btn-icon:hover{background:rgba(239,68,68,.15);color:var(--red)}
    .main{flex:1;padding:20px;max-width:1600px;margin:0 auto;width:100%}
    .stats-bar{display:flex;gap:12px;margin-bottom:20px;flex-wrap:wrap}
    .stat{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:12px 18px;min-width:110px;flex:1}
    .stat-value{font-size:1.6rem;font-weight:700;font-variant-numeric:tabular-nums}
    .stat-label{font-size:.75rem;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
    .stat.running .stat-value{color:var(--green)}
    .stat.expired .stat-value{color:var(--red)}
    .tabs{display:flex;gap:8px;margin-bottom:16px}
    .tab{padding:8px 18px;border-radius:999px;background:transparent;border:1px solid var(--border);color:var(--muted);font-size:.9rem;font-weight:600;cursor:pointer}
    .tab.active{background:var(--accent-dim);border-color:var(--accent);color:var(--accent)}
    .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}
    .card{background:var(--card);border:2px solid var(--border);border-radius:var(--radius);padding:16px;display:flex;flex-direction:column;gap:12px}
    .card.running{border-color:var(--green);box-shadow:0 0 0 1px rgba(34,197,94,.2)}
    .card.expired{background:var(--card-expired);border-color:var(--red);box-shadow:0 0 28px rgba(239,68,68,.5);animation:pulse 1.1s ease-in-out infinite}
    @keyframes pulse{0%,100%{box-shadow:0 0 16px rgba(239,68,68,.4)}50%{box-shadow:0 0 36px rgba(239,68,68,.75)}}
    .card-top{display:flex;align-items:center;gap:8px}
    .name-input{flex:1;background:rgba(15,23,42,.55);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1.15rem;font-weight:700;padding:9px 12px;outline:none}
    .name-input:focus{border-color:var(--accent)}
    .time-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .time-row label{color:var(--muted);font-size:.8rem}
    .time-input{width:56px;background:rgba(15,23,42,.55);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-weight:700;text-align:center;padding:7px 4px;outline:none}
    .time-input:focus{border-color:var(--accent)}
    .clock-input{width:110px;background:rgba(15,23,42,.55);border:1px solid var(--border);border-radius:8px;color:var(--text);font-size:1rem;font-weight:700;text-align:center;padding:7px 6px;outline:none}
    .clock-input:focus{border-color:var(--accent)}
    .display{font-variant-numeric:tabular-nums;font-size:2.8rem;font-weight:800;letter-spacing:.03em;text-align:center;padding:6px 0 2px;line-height:1}
    .card.running .display{color:var(--green)}
    .card.expired .display{color:#fecaca;font-size:2.4rem}
    .end-time{text-align:center;font-size:.8rem;color:var(--muted)}
    .card.running .end-time{color:#86efac}
    .card.expired .end-time{color:#fca5a5}
    .badge{font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.07em;padding:4px 10px;border-radius:999px;align-self:flex-start}
    .badge-idle{background:rgba(148,163,184,.15);color:var(--muted)}
    .badge-running{background:var(--green-dim);color:#4ade80}
    .badge-expired{background:var(--red-dim);color:#fca5a5}
    .actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .actions .btn{padding:12px 10px;font-size:.95rem}
    .history-panel{display:none}
    .history-panel.visible{display:block}
    .history-list{display:flex;flex-direction:column;gap:10px}
    .history-item{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
    .history-item .hi-name{font-weight:700;font-size:1.05rem}
    .history-item .hi-meta{font-size:.85rem;color:var(--muted)}
    .history-item .hi-duration{font-weight:700;color:var(--accent)}
    .empty{grid-column:1/-1;text-align:center;padding:60px 20px;color:var(--muted)}
    .empty p{margin-bottom:18px;font-size:1.1rem}
    #overlay{display:none;position:fixed;inset:0;background:rgba(127,29,29,.94);z-index:9999;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center}
    #overlay.show{display:flex}
    #overlay h2{font-size:clamp(2rem,7vw,3.8rem);font-weight:900;color:#fecaca;text-shadow:0 0 40px rgba(239,68,68,.7)}
    #overlay .names{font-size:clamp(1.15rem,4vw,1.9rem);font-weight:700;color:#fff;max-width:92%}
    #overlay .hint{color:#fca5a5;font-size:.95rem}
    #overlay .btn{margin-top:8px;padding:16px 36px;font-size:1.15rem}
    .footer{text-align:center;padding:12px;font-size:.75rem;color:var(--muted);border-top:1px solid var(--border)}
  </style>
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <div class="brand-icon">🎛</div>
      <div>
        <h1>Panel de Control Remoto</h1>
        <span>Recesos de operadores · Sincronizado en la nube</span>
      </div>
    </div>
    <div class="top-actions">
      <a href="index.html" class="btn btn-primary" style="text-decoration:none;">INICIO</a>
      <div class="global-time">
        <label>Default</label>
        <input type="number" id="default-min" min="0" max="999" value="15">
        <label>min</label>
        <input type="number" id="default-sec" min="0" max="59" value="0">
        <label>seg</label>
      </div>
      <button class="btn btn-primary" id="btn-add" type="button">＋ Agregar</button>
      <button class="btn btn-ghost" id="btn-start-all" type="button">▶ Todos</button>
      <button class="btn btn-ghost" id="btn-reset-all" type="button">↺ Todos</button>
      <button class="btn btn-danger" id="btn-clear" type="button">🗑 Limpiar todo</button>
    </div>
  </header>

  <main class="main">
    <div class="stats-bar">
      <div class="stat"><div class="stat-value" id="stat-total">0</div><div class="stat-label">Total</div></div>
      <div class="stat running"><div class="stat-value" id="stat-running">0</div><div class="stat-label">En receso</div></div>
      <div class="stat expired"><div class="stat-value" id="stat-expired">0</div><div class="stat-label">Vencidos</div></div>
      <div class="stat"><div class="stat-value" id="stat-history">0</div><div class="stat-label">Historial</div></div>
    </div>

    <div class="tabs">
      <button class="tab active" data-tab="operators" type="button">Operadores</button>
      <button class="tab" data-tab="history" type="button">Historial</button>
    </div>

    <div id="panel-operators"><div class="grid" id="grid"></div></div>
    <div id="panel-history" class="history-panel"><div class="history-list" id="history-list"></div></div>
  </main>

  <footer class="footer">
    Todo se guarda automáticamente en la nube. Todos los dispositivos ven lo mismo en tiempo real.
  </footer>

  <div id="overlay">
    <h2>¡TIEMPO VENCIDO!</h2>
    <div class="names" id="overlay-names"></div>
    <p class="hint">Presiona el botón para silenciar la alarma</p>
    <button class="btn btn-danger" id="btn-ack" type="button">Entendido · Silenciar</button>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    const SUPABASE_URL = 'https://vnsmjfumlizeexqgddii.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZzbm1qZnVtbGl6ZWV4cWdkZGlpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk3Nzk3NjcsImV4cCI6MjEwNTM1NTc2N30.wW-znjQD_5eN62Rtt2NfdX7AIlN6xeXpaTLNDr734Y4';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let operators = [];
    let history = [];
    let channel = null;
    let alarmPlaying = false;
    let audioCtx = null;
    let alarmInterval = null;
    const notifiedIds = new Set();

    async function guardEdit(){
      const { data: { session } } = await supabase.auth.getSession();
      if(!session){
        window.location.replace('index.html');
        return false;
      }
      return true;
    }

    function initAudio(){
      if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(audioCtx.state === 'suspended') audioCtx.resume();
    }
    function startAlarm(){
      if(alarmPlaying) return;
      initAudio();
      alarmPlaying = true;
      let step = 0;
      const beep = () => {
        if(!alarmPlaying) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'square';
        osc.frequency.value = step % 2 === 0 ? 880 : 660;
        gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.28, audioCtx.currentTime + 0.02);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + 0.28);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        step++;
      };
      beep();
      alarmInterval = setInterval(beep, 320);
    }
    function stopAlarm(){
      alarmPlaying = false;
      if(alarmInterval){ clearInterval(alarmInterval); alarmInterval = null; }
    }

    function formatTime(sec){
      sec = Math.max(0, Math.floor(sec));
      const m = Math.floor(sec/60);
      const s = sec % 60;
      return `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    }
    function formatClock(ts){
      if(!ts) return '—';
      return new Date(ts).toLocaleTimeString('es',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    function formatDateTime(ts){
      if(!ts) return '—';
      return new Date(ts).toLocaleString('es',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit'});
    }
    function getDefaultSeconds(){
      const min = Math.max(0, parseInt(document.getElementById('default-min').value,10) || 0);
      let sec = Math.max(0, parseInt(document.getElementById('default-sec').value,10) || 0);
      if(sec > 59) sec = 59;
      return min*60 + sec;
    }
    function escapeHtml(str){
      const d = document.createElement('div');
      d.textContent = String(str ?? '');
      return d.innerHTML;
    }
    function getRemaining(op){
      if(op.status === 'running' && op.end_at){
        return Math.max(0, Math.ceil((new Date(op.end_at).getTime() - Date.now())/1000));
      }
      return Math.max(0, op.remaining || 0);
    }

    // ---------- DB ----------
    async function dbInsertOperator(data){
      const { data: rows, error } = await supabase.from('operators').insert(data).select().single();
      if(error) console.error(error);
      return rows;
    }
    async function dbUpdateOperator(id, patch){
      const { error } = await supabase.from('operators').update(patch).eq('id', id);
      if(error) console.error(error);
    }
    async function dbDeleteOperator(id){
      const { error } = await supabase.from('operators').delete().eq('id', id);
      if(error) console.error(error);
    }
    async function dbInsertHistory(data){
      const { error } = await supabase.from('history').insert(data);
      if(error) console.error(error);
    }

    // ---------- TICK ----------
    setInterval(async () => {
      // Actualiza displays locales
      operators.forEach(op => {
        if(op.status === 'running'){
          const rem = getRemaining(op);
          op.remaining = rem;
        }
      });
      // Detectar vencidos y persistir
      for(const op of operators){
        if(op.status === 'running' && op.remaining <= 0){
          op.status = 'expired';
          op.remaining = 0;
          op.end_at = null;
          await dbUpdateOperator(op.id, { status: 'expired', remaining: 0, end_at: null });
          await dbInsertHistory({
            operator_id: op.id,
            name: op.name,
            total_seconds: op.total_seconds,
            started_at: op.started_at,
            ended_at: new Date().toISOString()
          });
        }
      }
      renderOperators();
      updateOverlay();
    }, 1000);

    // ---------- REALTIME ----------
    function subscribeRealtime(){
      if(channel) supabase.removeChannel(channel);
      channel = supabase
        .channel('recesos-panel')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'operators' }, payload => {
          const { eventType, new: newRow, old: oldRow } = payload;
          if(eventType === 'INSERT'){
            if(!operators.find(o => o.id === newRow.id)) operators.push(newRow);
          } else if(eventType === 'UPDATE'){
            const i = operators.findIndex(o => o.id === newRow.id);
            if(i >= 0) operators[i] = newRow;
            else operators.push(newRow);
          } else if(eventType === 'DELETE'){
            operators = operators.filter(o => o.id !== oldRow.id);
          }
          renderOperators();
          updateOverlay();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'history' }, payload => {
          if(payload.eventType === 'INSERT'){ history.unshift(payload.new); renderHistory(); }
        })
        .subscribe();
    }

    async function loadInitial(){
      const [opsRes, histRes] = await Promise.all([
        supabase.from('operators').select('*').order('id'),
        supabase.from('history').select('*').order('ended_at', { ascending: false }).limit(200)
      ]);
      operators = opsRes.data || [];
      history = histRes.data || [];
    }

    // ---------- RENDER ----------
    function render(){
      document.getElementById('stat-total').textContent = operators.length;
      document.getElementById('stat-running').textContent = operators.filter(o => o.status === 'running').length;
      document.getElementById('stat-expired').textContent = operators.filter(o => o.status === 'expired').length;
      document.getElementById('stat-history').textContent = history.length;
      renderOperators();
      renderHistory();
      updateOverlay();
    }

    function renderOperators(){
      const grid = document.getElementById('grid');
      grid.innerHTML = '';
      if(operators.length === 0){
        grid.innerHTML = `<div class="empty"><p>No hay operadores. Agrega el primero.</p>
          <button class="btn btn-primary" type="button" onclick="addOperator()">＋ Agregar operador</button></div>`;
        return;
      }
      operators.forEach(op => {
        const rem = getRemaining(op);
        if(op.status === 'running') op.remaining = rem;
        const card = document.createElement('div');
        card.className = 'card';
        if(op.status === 'running') card.classList.add('running');
        if(op.status === 'expired') card.classList.add('expired');
        const badgeClass = op.status === 'running' ? 'badge-running'
                         : op.status === 'expired' ? 'badge-expired' : 'badge-idle';
        const badgeText = op.status === 'running' ? 'En receso'
                        : op.status === 'expired' ? '¡Vencido!' : 'Listo';
        const displaySec = op.status === 'expired' ? 0 : rem;
        const showMin = Math.floor(displaySec/60);
        const showSec = displaySec % 60;
        card.innerHTML = `
          <div class="card-top">
            <input class="name-input" type="text" value="${escapeHtml(op.name)}" placeholder="Nombre" data-id="${op.id}" data-field="name">
            <button class="btn-icon" type="button" title="Eliminar" data-id="${op.id}" data-action="delete">✕</button>
          </div>
          <div class="time-row">
            <label>Tiempo</label>
            <input class="time-input" type="number" min="0" max="999" value="${showMin}" data-id="${op.id}" data-field="minutes">
            <label>min</label>
            <input class="time-input" type="number" min="0" max="59" value="${showSec}" data-id="${op.id}" data-field="seconds">
            <label>seg</label>
          </div>
          <div class="time-row">
            <label>Hora inicio</label>
            <input class="clock-input" type="time" value="${op.target_time || ''}" data-id="${op.id}" data-field="target_time">
            <label style="font-size:.75rem;color:var(--muted)">(opcional)</label>
          </div>
          <div class="display">${formatTime(displaySec)}</div>
          <div class="end-time">
            ${op.status === 'running' && op.end_at
              ? 'Termina a las ' + formatClock(op.end_at)
              : op.status === 'expired'
                ? 'Tiempo agotado'
                : (op.target_time
                    ? 'Inicia a las ' + op.target_time + ' · dura ' + formatTime(op.total_seconds || 0)
                    : 'Duración total: ' + formatTime(op.total_seconds))}
          </div>
          <span class="badge ${badgeClass}">${badgeText}</span>
          <div class="actions">
            ${op.status === 'running'
              ? `<button class="btn btn-warning" type="button" data-id="${op.id}" data-action="pause">⏸ Pausar</button>`
              : `<button class="btn btn-success" type="button" data-id="${op.id}" data-action="start">▶ Iniciar</button>`}
            <button class="btn btn-ghost" type="button" data-id="${op.id}" data-action="reset">↺ Reiniciar</button>
          </div>
        `;
        grid.appendChild(card);
      });
      grid.querySelectorAll('[data-field]').forEach(el => {
        el.addEventListener('change', onFieldChange);
        el.addEventListener('blur', onFieldChange);
      });
      grid.querySelectorAll('[data-action]').forEach(el => {
        el.addEventListener('click', onAction);
      });
    }

    function renderHistory(){
      const list = document.getElementById('history-list');
      if(history.length === 0){
        list.innerHTML = `<div class="empty"><p>Aún no hay registros en el historial.</p></div>`;
        return;
      }
      list.innerHTML = history.map(h => `
        <div class="history-item">
          <div>
            <div class="hi-name">${escapeHtml(h.name)}</div>
            <div class="hi-meta">
              ${h.started_at ? 'Inicio: ' + formatDateTime(h.started_at) + ' · ' : ''}
              Fin: ${formatDateTime(h.ended_at)}
            </div>
          </div>
          <div class="hi-duration">${formatTime(h.total_seconds)}</div>
        </div>
      `).join('');
    }

    function updateOverlay(){
      const expired = operators.filter(o => o.status === 'expired');
      const overlay = document.getElementById('overlay');
      const namesEl = document.getElementById('overlay-names');
      if(expired.length > 0){
        namesEl.textContent = expired.map(o => o.name || 'Sin nombre').join('  ·  ');
        overlay.classList.add('show');
        startAlarm();
      }else{
        overlay.classList.remove('show');
        stopAlarm();
      }
    }

    // ---------- ACTIONS ----------
    async function addOperator(){
      const total = getDefaultSeconds() || 15*60;
      const newOp = {
        name: `Operador ${operators.length + 1}`,
        total_seconds: total,
        remaining: total,
        status: 'idle',
        end_at: null,
        started_at: null,
        target_time: ''
      };
      await dbInsertOperator(newOp);
    }

    async function onFieldChange(e){
      const id = parseInt(e.target.dataset.id, 10);
      const field = e.target.dataset.field;
      const op = operators.find(o => o.id === id);
      if(!op) return;

      if(field === 'name'){
        const newName = e.target.value.trim() || `Operador ${id}`;
        op.name = newName;
        await dbUpdateOperator(id, { name: newName });
        return;
      }

      if(field === 'target_time'){
        op.target_time = e.target.value || '';
        await dbUpdateOperator(id, { target_time: op.target_time });
        renderOperators();
        return;
      }

      const card = e.target.closest('.card');
      const minEl = card.querySelector('[data-field="minutes"]');
      const secEl = card.querySelector('[data-field="seconds"]');
      let mins = Math.max(0, parseInt(minEl.value,10) || 0);
      let secs = Math.max(0, parseInt(secEl.value,10) || 0);
      if(secs > 59){ secs = 59; secEl.value = 59; }
      const newRemaining = mins*60 + secs;

      const patch = {};
      if(op.status === 'running'){
        const endAt = new Date(Date.now() + newRemaining*1000).toISOString();
        patch.remaining = newRemaining;
        patch.end_at = endAt;
        op.remaining = newRemaining;
        op.end_at = endAt;
        if(newRemaining <= 0){
          patch.status = 'expired';
          patch.end_at = null;
          op.status = 'expired';
          op.end_at = null;
        }
      } else if(op.status === 'expired'){
        patch.remaining = newRemaining;
        patch.total_seconds = newRemaining || op.total_seconds;
        patch.status = newRemaining > 0 ? 'idle' : 'expired';
        patch.end_at = null;
        op.remaining = newRemaining;
        op.total_seconds = patch.total_seconds;
        op.status = patch.status;
        op.end_at = null;
      } else {
        patch.remaining = newRemaining;
        patch.total_seconds = newRemaining;
        patch.end_at = null;
        op.remaining = newRemaining;
        op.total_seconds = newRemaining;
      }
      await dbUpdateOperator(id, patch);
    }

    function clockTimeToday(hhmm){
      if(!hhmm || !/^\d{1,2}:\d{2}$/.test(hhmm)) return null;
      const [h, m] = hhmm.split(':').map(Number);
      if(h > 23 || m > 59) return null;
      const d = new Date();
      d.setHours(h, m, 0, 0);
      return d.getTime();
    }

    async function onAction(e){
      const btn = e.target.closest('[data-action]');
      if(!btn) return;
      const id = parseInt(btn.dataset.id, 10);
      const action = btn.dataset.action;
      const op = operators.find(o => o.id === id);
      if(!op) return;

      if(action === 'delete'){
        await dbDeleteOperator(id);
      } else if(action === 'start'){
        await startOp(op);
      } else if(action === 'pause'){
        await pauseOp(op);
      } else if(action === 'reset'){
        await resetOp(op);
      }
    }

    async function startOp(op){
      if(op.status === 'running') return;
      let duration = op.total_seconds;
      if(!duration || duration <= 0){
        duration = getDefaultSeconds() || 30*60;
      }
      let rem, endAt, startedAt;

      if(op.target_time){
        const startTs = clockTimeToday(op.target_time);
        if(startTs === null){ alert('Hora de inicio no válida.'); return; }
        endAt = startTs + duration*1000;
        const now = Date.now();
        if(now >= endAt){
          await dbUpdateOperator(op.id, {
            status: 'expired', remaining: 0, end_at: null,
            started_at: new Date(startTs).toISOString()
          });
          return;
        }
        rem = Math.ceil((endAt - now)/1000);
        startedAt = new Date(startTs).toISOString();
      } else {
        rem = op.remaining > 0 ? op.remaining : duration;
        endAt = Date.now() + rem*1000;
        startedAt = new Date().toISOString();
      }

      await dbUpdateOperator(op.id, {
        status: 'running',
        remaining: rem,
        end_at: new Date(endAt).toISOString(),
        started_at: startedAt,
        total_seconds: duration
      });
    }

    async function pauseOp(op){
      if(op.status !== 'running') return;
      await dbUpdateOperator(op.id, {
        status: 'idle',
        remaining: getRemaining(op),
        end_at: null
      });
    }

    async function resetOp(op){
      const total = op.total_seconds || getDefaultSeconds() || 0;
      await dbUpdateOperator(op.id, {
        status: 'idle',
        remaining: total,
        end_at: null,
        started_at: null
      });
    }

    // ---------- INIT ----------
    document.getElementById('btn-add').addEventListener('click', addOperator);
    document.getElementById('btn-start-all').addEventListener('click', async () => {
      for(const op of operators){
        if(op.status !== 'running' && op.status !== 'expired') await startOp(op);
      }
    });
    document.getElementById('btn-reset-all').addEventListener('click', async () => {
      if(!confirm('¿Reiniciar todos los operadores al tiempo original?')) return;
      for(const op of operators) await resetOp(op);
    });
    document.getElementById('btn-clear').addEventListener('click', async () => {
      if(!confirm('¿Borrar TODOS los operadores y el historial?')) return;
      await supabase.from('operators').delete().neq('id', 0);
      await supabase.from('history').delete().neq('id', 0);
    });
    document.getElementById('btn-ack').addEventListener('click', async () => {
      for(const op of operators){
        if(op.status === 'expired'){
          await dbUpdateOperator(op.id, {
            status: 'idle',
            remaining: op.total_seconds,
            end_at: null,
            started_at: null
          });
        }
      }
      notifiedIds.clear();
      stopAlarm();
    });
    document.querySelectorAll('.tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        const which = tab.dataset.tab;
        document.getElementById('panel-operators').style.display = which === 'operators' ? 'block' : 'none';
        document.getElementById('panel-history').classList.toggle('visible', which === 'history');
      });
    });
    document.body.addEventListener('click', () => initAudio(), { once: true });

    (async () => {
      const ok = await guardEdit();
      if(!ok) return;
      await loadInitial();
      render();
      subscribeRealtime();
    })();
  </script>
</body>
</html>
